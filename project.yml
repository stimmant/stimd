name: stimd
options:
  bundleIdPrefix: com.stimma
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    branch: main

targets:
  Stimd:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/**"
      - path: App/Resources
        buildPhase: resources
      - path: Core
    dependencies:
      - package: swift-markdown
        product: Markdown
      - target: StimdQuickLook
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stimma.stimd
        PRODUCT_NAME: stimd
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  StimdQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
      - path: Core
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stimma.stimd.quicklook
        PRODUCT_NAME: StimdQuickLook
        INFOPLIST_FILE: QuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickLook/QuickLook.entitlements
        SKIP_INSTALL: YES

schemes:
  stimd:
    build:
      targets:
        Stimd: all
    run:
      config: Release
